version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: server.Dockerfile
    container_name: scafi-mcp-server
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dsun.java2d.opengl=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

