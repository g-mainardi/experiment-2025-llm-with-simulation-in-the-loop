name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ hashFiles('build.mill', '.mill-version') }}
      - run: ./mill mill.scalalib.scalafmt/checkFormatAll
      - run: ./mill __.compile
      - run: ./mill exp.test
      - name: Simulation smoke test
        run: ./mill mcp_server.test.runMain it.unibo.llm.mcp.server.SimulationProbe "$PWD/mcp_server/src/main/scala/it/unibo/scafi/CircleFormation.scala"
      # The server jar (also the one in the Docker image) merges every dependency into one file, which can lose what
      # the Mill classpath has, such as the Groovy script engine the scenario needs: judge one program from the jar
      - name: Server jar smoke test
        run: |
          ./mill mcp_server.assembly
          dir="$RUNNER_TEMP/jar-check"
          mkdir -p "$dir"
          jq -n --rawfile program mcp_server/src/main/scala/it/unibo/scafi/CircleFormation.scala \
            '{target: {shape: "circle", radius: 0.6}, finalProgram: $program}' > "$dir/circle-control.json"
          java -cp out/mcp_server/assembly.dest/out.jar it.unibo.llm.mcp.server.Evaluate "$dir"
          jq -e '.evaluation.passed' "$dir/circle-control.json"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server.Dockerfile .

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status
      # Squash-merge uses the PR title as commit subject (checked on open and push, not on title edits)
      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg "$RUNNER_TEMP/title"

  # Single check required by the master ruleset
  success:
    needs: [build, docker, commits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
