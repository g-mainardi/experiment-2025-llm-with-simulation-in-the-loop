incarnation: scafi

network-model:
  type: ConnectWithinDistance
  parameters: [ 5 ]

_constants:
  retentionTime: &retentionTime 25.0

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunScafiProgram
        parameters: [ "{{ }}", *retentionTime ]
  - program: send
_move: &move
  - time-distribution: 1
    type: Event
    actions:
      - type: DifferentialRobotMovement
        parameters: [ "actuation", 0.0001, 0.5 ]

monitors:
 - type: SwingGUI
   parameters:
     graphics: effects/simulation.json

launcher:
 parameters:
   batch: []
   autoStart: false

environment:
  type: Continuous2DEnvironment
  parameters: []

deployments:
  - type: Grid
    parameters: [ 0, 0, 4, 4, 1, 1 ]
    programs:
      - *program
      - *move
    contents:
      - molecule: source
        concentration: false
      - molecule: leader
        concentration: 1
      - molecule: stabilityThreshold
        concentration: 0.1
      - molecule: collisionArea
        concentration: 0.2
    properties:
      - type: DirectionalRobotProperty
        parameters: [ 0, 0.1 ]

export:
  - type: CSVExporter
    parameters:
      fileNameRoot: "experiment"
      interval: 100
      exportPath: "data-movement"
    data:
      - time
      - type: NodesPositions